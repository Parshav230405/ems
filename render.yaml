services:
  - type: web
    name: aura-ems
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build && cd backend && npx prisma db push && npm run prisma:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
